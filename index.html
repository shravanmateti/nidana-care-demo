<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Nidana Care – clickable prototype</title>
<style>

button{font:inherit;cursor:pointer;color:var(--tx)}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--ln);border-radius:10px;padding:13px 14px;margin-bottom:9px}

.bar{height:6px;background:var(--ln);border-radius:3px;margin:14px 0 18px;overflow:hidden}

.dos{margin:8px 0}.dos div{display:flex;justify-content:space-between;font-size:14px}
.dos s{display:block;height:8px;border-radius:4px;background:var(--ac);text-decoration:none;margin-top:3px}
ul{margin:4px 0 10px;padding-left:20px}li{margin-bottom:5px}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:20px;padding:3px 11px;font-size:13px;margin:0 6px 6px 0;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:var(--bg);border:1.5px solid var(--ln);border-radius:20px;padding:6px 13px;font-size:14px}
.tabs button.on{background:var(--ac);color:var(--sf);border-color:var(--ac)}
:root{--no:#fff4dc;--nt:#6b4a00;--ok:#2f6b3a;--okb:#e3f1e5}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--no:#3a3220;--nt:#f2d58a;--ok:#8fd49b;--okb:#1f3324}}
body{font-size:15px}
.wrap{max-width:980px;margin:0 auto;padding:0 14px 60px}

.err{color:#8a2b22;background:#f7e2de;border-radius:8px;padding:6px 10px;font-size:13px;margin:8px 0}
details.card summary{cursor:pointer}
@media(max-width:700px){.top{position:static}
table a,li a,.note a,.mu a{display:inline-block;padding:11px 3px}
.rxbar{position:sticky;bottom:0;z-index:4;background:var(--bg);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln)}
.wrap{padding:0 12px 60px}
button,select,.pills button,.stg button,.chips button,.tabs button{min-height:44px}
.btn.s{min-height:44px;padding:9px 14px}
.stg summary{padding:10px 0;min-height:44px;display:flex;align-items:center}

input[type=checkbox],input[type=radio]{width:22px;height:22px;min-height:0}
label.ck{padding:4px 0}
select,input,textarea{font-size:16px;min-height:44px}
.pills,.stgb{gap:8px}
table.stk,table.stk tbody,table.stk tr,table.stk td{display:block;width:100%}

.card{padding:14px}
.nxt .btn{width:100%}
}

.rxbar{margin-top:10px}
.auth{max-width:520px;margin:14px auto 0}.auth input{width:100%}.auth label{display:block;margin-bottom:8px}
.acct{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;font-size:13px;margin-top:6px}

a.btn.dir{display:inline-flex;align-items:center;text-decoration:none;box-sizing:border-box}
</style></head><body><div class="wrap" id="root"></div><div id="toast" role="status"></div>
<script>

// flags: d=diffuse, pa=patchy, sh=shock-shedding, he=hereditary, sP/sV/sK=scalp type, aV/aT/aM=agni vishama/tikshna/manda,
// am=ama, dh=dhatu depletion, st=stress, sl=sleep, ho=hormonal/systemic, nu=nutrition, ex=external, rd=red flag, ch=chronic
const Q=[
{s:"Pattern (Pareeksha)",q:"How would you describe the hair loss?",o:[
["Gradual thinning all over, wider parting",{d:1}],
["Receding hairline or crown thinning",{d:1,he:1}],
["Sudden round or oval bald patches",{pa:1}],
["Heavy shedding that began 2–3 months after illness, delivery, surgery or shock",{d:1,sh:1}]]},
{s:"Pattern (Pareeksha)",q:"How long has it been going on?",o:[
["Less than 3 months",{}],["3 to 12 months",{}],["More than a year",{ch:1}]]},
{s:"Scalp (Pareeksha)",q:"What does your scalp and hair feel like? Select all that apply.",m:1,o:[
["Hot, burning, sensitive or sweaty scalp; early greying",{p:2,sP:1}],
["Dry, tight scalp; hair rough, frizzy, brittle, splitting",{v:2,sV:1}],
["Oily, heavy scalp; flaking dandruff, itching",{k:2,sK:1}],
["None of these",{}]]},
{s:"Diet (Ahara)",q:"Which describes your usual food? Select all that apply.",m:1,o:[
["Lots of spicy, salty, sour, fried or processed food; tea, coffee or alcohol",{p:2,hP:1}],
["Skipped or irregular meals, dry or cold food, crash dieting",{v:2,hV:1}],
["Heavy, sweet, oily or dairy-rich food; overeating; cold drinks",{k:2,hK:1}],
["Low in protein, greens, nuts or iron-rich foods",{nu:1}]]},
{s:"Lifestyle (Vihara)",q:"What best describes your stress?",o:[
["Worry, anxiety, overthinking, fear",{v:2,st:1}],
["Anger, irritability, deadline pressure",{p:2,st:1}],
["Low mood, lethargy, attachment, withdrawal",{k:2,st:1}],
["Mostly calm",{}]]},
{s:"Lifestyle (Vihara)",q:"How is your sleep?",o:[
["Light, broken, or under 6 hours",{v:1,sl:1}],
["Late nights, screens, but I fall asleep",{p:1,sl:1}],
["Long and heavy, wake up groggy",{k:1}],
["Sound, 7–8 hours",{}]]},
{s:"Digestion (Agni)",q:"How is your digestion and appetite?",o:[
["Irregular hunger, gas, bloating, constipation",{v:1,aV:1}],
["Sharp hunger, acidity, heartburn, loose stools",{p:1,aT:1}],
["Low hunger, heaviness, nausea after eating",{k:1,aM:1}],
["Regular and comfortable",{}]]},
{s:"Digestion (Agni)",q:"Do you notice signs of undigested residue (Ama)? Select all that apply.",m:1,o:[
["Coated tongue in the morning",{am:1}],
["Heaviness or lethargy after meals",{am:1}],
["Sticky stools or foul breath",{am:1}],
["None",{}]]},
{s:"Tissues (Dhatu Posha)",q:"Any signs of Asthi or Majja dhatu depletion? Select all that apply.",m:1,o:[
["Brittle or ridged nails, weak teeth",{dh:1,v:1}],
["Joint cracking, bone or back aches",{dh:1,v:1}],
["Constant fatigue or weakness, easily exhausted",{dh:1}],
["Dry skin and lips, weight loss",{dh:1,v:1}],
["None",{}]]},
{s:"Systemic review",q:"Any of these? Select all that apply.",m:1,o:[
["Thyroid disorder",{ho:"thyroid"}],
["PCOS or irregular periods",{ho:"PCOS / hormonal"}],
["Delivery or breastfeeding in the last 12 months",{ho:"postpartum",pp:1,ca:"Recent delivery or breastfeeding: skip Nasya and Shodhana, and check any herb with your doctor."}],
["Anaemia, low ferritin, B12 or vitamin D",{ho:"nutrient deficiency",nu:1}],
["Fever, surgery or major illness in the last 6 months",{sh:1}],
["None",{}]]},
{s:"Heredity & habits",q:"Does baldness or thinning run in your family?",o:[
["Yes, parents or grandparents",{he:1}],["No / not sure",{}]]},
{s:"Heredity & habits",q:"External factors (Agantuja Hetu). Select all that apply.",m:1,o:[
["Hot showers, hard water, frequent shampooing",{ex:1}],
["Colouring, straightening or heat styling",{ex:1}],
["Tight hairstyles, helmet or cap all day",{ex:1}],
["I never oil my scalp",{ex:1,v:1}],
["None",{}]]},
{s:"Safety check",q:"Any warning signs? Select all that apply.",m:1,o:[
["Painful, pus-filled or scarring scalp",{rd:"Painful, pus-filled or scarring scalp can mean scarring alopecia, where early treatment prevents permanent loss."}],
["Eyebrows, lashes or body hair also falling",{rd:"Loss of eyebrows, lashes or body hair together with scalp hair suggests a systemic or autoimmune cause."}],
["Patches with rash, scaly plaques or nail pitting",{rd:"Patches with rash or scaling need a skin examination to rule out fungal infection or psoriasis."}],
["Unexplained weight loss, fever or very rapid loss",{rd:"Rapid hair loss with weight loss or fever needs blood tests to rule out a systemic illness."}],
["None",{}]]}
];
Q.forEach((q,ix)=>q.tid=ix);
Q.unshift(
{s:"About you",q:"What is the age group of the person this is for?",o:[
["Under 18",{rd:"Hair fall in children and teenagers needs a doctor's check first, because causes differ from adults."}],
["18 to 40",{}],["41 to 60",{}],
["Over 60",{ca:"At older ages, hair loss and any herbs need extra care. Review the plan with a doctor."}]]},
{s:"About you",q:"Are you pregnant or trying to conceive?",o:[
["Yes",{pg:1,ca:"Pregnancy: do not start herbs, Nasya or Shodhana without your own doctor's approval."}],
["No / not applicable",{}]]},
{s:"Medicines",q:"Do you take any regular medicines? Select all that apply.",m:1,o:[
["Thyroid medicine",{med:"thyroid medicine"}],
["Blood pressure or heart medicine",{med:"blood pressure or heart medicine"}],
["Diabetes medicine or insulin",{med:"diabetes medicine"}],
["Blood thinner",{med:"blood thinner"}],
["Other regular medicine",{med:"other regular medicine"}],
["None",{}]]}
);
const P={
v:{n:"Vata",ahara:["Warm, freshly cooked, moist meals at fixed times","Include sesame, ghee, soaked almonds, dates, mung dal, sweet and sour fruits","Avoid fasting, raw salads, cold drinks, dry snacks"],
vihara:["Sleep before 10:30 pm; wind down without screens","Daily 10-minute breathing practice (Anulom Vilom, Bhramari)","Keep a steady daily routine"],
local:["Warm Abhyanga of the scalp with Bhringaraja or Neelibhringadi taila, 3 times a week, 30 minutes before a lukewarm wash","Nasya with Anu taila (2 drops each nostril), ideally taught by a Vaidya"],
herbs:["Ashwagandha, Bala, Shatavari (nourish Majja and calm Vata)","Bhringaraja and Amalaki (Kesya rasayana)"],
sho:"Anuvasana or Matra Basti, if indicated"},
p:{n:"Pitta",ahara:["Cooling, mildly sweet and bitter foods: gourd, coriander, pomegranate, amla, coconut water, ghee","Cut back on chilli, pickles, excess salt, sour curd, fried food, tea, coffee, alcohol","Don’t skip lunch; eat by 1 pm"],
vihara:["Avoid anger, overwork and midday sun; cover your head outdoors","Cool, not hot, water for the final rinse","Shitali pranayama and a short evening walk"],
local:["Cooling scalp Abhyanga with coconut oil, Bhringaraja or Neelibhringadi taila 2–3 times a week","Lepana with Amalaki, Bhringaraja and Yashtimadhu powder paste","Shirodhara with Ksheerabala taila, under supervision, if stress is prominent"],
herbs:["Amalaki, Guduchi, Yashtimadhu, Shatavari (Pitta-Rakta shamana)","Bhringaraja and Brahmi"],
sho:"Mridu Virechana, if indicated"},
k:{n:"Kapha",ahara:["Light, warm, dry-cooked food with bitter, pungent and astringent tastes; barley, millet, mung, leafy greens","Reduce dairy, sweets, fried and cold food; avoid daytime sleep","Ginger-cumin or Trikatu water before meals"],
vihara:["Daily brisk exercise for at least 30 minutes","Wake before 6:30 am; no daytime naps","Wash scalp regularly to prevent build-up"],
local:["Light oiling only 1–2 times a week (Bhringaraja or sesame oil, warm), washed off within 30 minutes","Wash with Shikakai, Reetha or Triphala decoction","Lepana with Triphala and Nimba for flaking or itching"],
herbs:["Triphala, Trikatu, Guduchi (clear Ama and Srotorodha)","Bhringaraja, Nimba"],
sho:"Vamana or Lekhana therapy, if indicated"}};

let i=0,ans=Q.map(()=>[]);let app=null;
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function _i0(){app.innerHTML=`<h1>Khalitya Nidana</h1><p class="mu" style="margin:6px 0 18px">An Ayurvedic hair fall assessment that follows classical Roga Pariksha: cause, scalp, digestion and tissues, then a root-cause diagnosis and plan.</p>
<div class="card"><h3>What happens next</h3><ul><li>14 short questions, about 4 minutes</li><li>You get a Dosha profile, root causes and a personalised plan</li><li>Nothing leaves your device unless you choose to share it</li></ul>
<p class="mu">This is an educational screening tool. It does not replace examination by a registered Ayurvedic physician (BAMS) or a dermatologist.</p></div>
<button class="btn" style="width:100%" onclick="go(0)">Start assessment</button>`}
function go(n){if(n===0&&window.onAssessmentStart)window.onAssessmentStart();if(window.onAssessmentStep)window.onAssessmentStep(n);i=n;draw()}
function _d0(){const q=Q[i],a=ans[i];
app.innerHTML=`<div class="bar" role="progressbar" aria-valuenow="${i+1}" aria-valuemax="${Q.length}"><i style="width:${(i+1)/Q.length*100}%"></i></div>
<div class="sec">${q.s} · Question ${i+1} of ${Q.length}</div><h2>${q.q}</h2>
${q.o.map((o,j)=>`<button class="opt ${a.includes(j)?"on":""}" onclick="pick(${j})">${esc(o[0])}</button>`).join("")}
<div class="row"><button class="btn g" onclick="${i?`go(${i-1})`:"intro()"}">Back</button>
<button class="btn" ${a.length?"":"disabled"} onclick="${i<Q.length-1?`go(${i+1})`:"result()"}">${i<Q.length-1?"Next":"See diagnosis"}</button></div>`;scrollTo(0,0)}
function pick(j){const q=Q[i],none=q.o.length-1;let a=ans[i];
if(!q.m){a=[j]}else{const isNone=q.o[j][0]==="None"||q.o[j][0]==="None of these"||q.o[j][0]==="No / not sure";
if(isNone)a=[j];else{a=a.filter(x=>!/^None/.test(q.o[x][0]));a=a.includes(j)?a.filter(x=>x!==j):[...a,j]}}
ans[i]=a;draw()}
function result(){cur=result;
const S={v:0,p:0,k:0},F={},H=[],R=[],MD=[],CA=[];
ans.forEach((a,qi)=>a.forEach(j=>{const f=Q[qi].o[j][1];for(const k in f){
if(k==="ho")H.push(f[k]);else if(k==="med")MD.push(f[k]);else if(k==="ca")CA.push(f[k]);else if(k==="rd")R.push(f[k]);else if(k==="v"||k==="p"||k==="k")S[k]+=f[k];else F[k]=(F[k]||0)+f[k]}}));
if(F.pa)R.push("Sudden patchy hair loss should be seen by a doctor or dermatologist first, because causes such as alopecia areata or fungal infection need different treatment.");
const tot=S.v+S.p+S.k||1,rank=Object.keys(S).sort((a,b)=>S[b]-S[a]);
const noPat=(S.v+S.p+S.k)===0,dual=S[rank[1]]>=S[rank[0]]*0.8&&S[rank[1]]>0,doms=noPat?[]:(dual?[rank[0],rank[1]]:[rank[0]]);
const dn=noPat?"No clear dosha pattern":doms.map(d=>P[d].n).join("–");
const type=F.pa?"Indralupta (patchy hair loss)":"Khalitya (diffuse hair loss)";
const agni=F.aV>=1&&F.aT>=1?"Mixed":F.aV?"Vishama Agni (irregular, Vata)":F.aT?"Tikshna Agni (excessive, Pitta)":F.aM?"Manda Agni (weak, Kapha)":"Sama Agni (balanced)";
const ama=F.am>=2?"Significant":F.am?"Mild":"Not evident";
const dhatu=F.dh>=3||(F.dh&&F.nu)?"Asthi–Majja Dhatu Kshaya (depletion) likely":F.dh?"Early Asthi–Majja strain":"No clear depletion";
// root causes
const rc=[];
if(F.hP)rc.push("Pitta-provoking diet (Ahara Nidana): heat reaches the hair roots and weakens them.");
if(F.hV)rc.push("Vata-provoking diet (Ahara Nidana): irregular, dry or restricted eating starves Asthi and Majja dhatu.");
if(F.hK)rc.push("Kapha-provoking diet (Ahara Nidana): heavy food causes Ama and blocks scalp channels.");
if(F.nu)rc.push("Low protein or iron intake: raw material for Asthi dhatu is short.");
if(F.st)rc.push("Mental stress (Manasika Nidana) disturbs Doshas and raises cortisol.");
if(F.sl)rc.push("Poor sleep (Vihara Nidana) aggravates Vata and Pitta and delays tissue repair.");
if(F.aV||F.aT||F.aM)rc.push("Disturbed Agni: food is not fully converted into nourishing Dhatus.");
if(F.am)rc.push("Ama (metabolic residue) is clogging the channels (Srotorodha) that carry nutrition to the scalp.");
if(F.dh)rc.push("Asthi–Majja Dhatu weakness: hair (Kesha) is the Mala of Asthi, so weak tissue shows first as thin hair.");
if(F.he)rc.push("Hereditary tendency (Sahaja or Kulaja): points to a longer course and need for sustained therapy.");
if(F.sh)rc.push("Recent shock to the body (Agantuja Hetu): a temporary surge of shedding is common 2–3 months after illness or delivery.");
if(H.length)rc.push("Systemic factors to confirm with blood tests: "+H.join(", ")+".");
if(F.ex)rc.push("External damage: washing, heat, chemicals or friction weakens hair shafts and scalp.");

["జీర్ణం, ఆకలి ఎలా ఉన్నాయి?",["ఆకలి క్రమరహితం, గ్యాస్, ఉబ్బరం, మలబద్ధకం","ఎక్కువ ఆకలి, ఎసిడిటీ, గుండెల్లో మంట, పలుచని విరేచనాలు","ఆకలి తక్కువ, బరువుగా అనిపించడం, తిన్నాక వికారం","సక్రమంగా, సౌకర్యంగా"]],
["ఆమ (జీర్ణంకాని అవశేషం) లక్షణాలు ఉన్నాయా? వర్తించేవన్నీ ఎంచుకోండి.",["ఉదయం నాలుకపై పొర","తిన్నాక బరువు లేదా బద్ధకం","జిగట మలం లేదా నోటి దుర్వాసన","ఏదీ లేదు"]],
["అస్థి–మజ్జ ధాతు క్షయ సంకేతాలు? వర్తించేవన్నీ ఎంచుకోండి.",["గోర్లు పెళుసు లేదా చారలు, బలహీన దంతాలు","కీళ్ల శబ్దం, ఎముక లేదా నడుము నొప్పి","నిరంతర అలసట, బలహీనత","పొడి చర్మం, పెదవులు; బరువు తగ్గడం","ఏదీ లేదు"]],
["వీటిలో ఏమైనా ఉన్నాయా? వర్తించేవన్నీ ఎంచుకోండి.",["థైరాయిడ్","PCOS లేదా క్రమరహిత నెలసరి","గత 12 నెలల్లో ప్రసవం లేదా పాలివ్వడం","రక్తహీనత, తక్కువ ఫెరిటిన్, B12 లేదా విటమిన్ D","గత 6 నెలల్లో జ్వరం, శస్త్రచికిత్స లేదా పెద్ద అనారోగ్యం","ఏదీ లేదు"]],
["కుటుంబంలో బట్టతల లేదా జుట్టు పలుచబడటం ఉందా?",["అవును, తల్లిదండ్రులు లేదా తాతలలో","లేదు / తెలియదు"]],
["బాహ్య కారణాలు. వర్తించేవన్నీ ఎంచుకోండి.",["వేడి నీటి స్నానం, గట్టి నీరు, తరచు షాంపూ","రంగు వేయడం, స్ట్రెయిటెనింగ్, హీట్ స్టైలింగ్","బిగుతైన జడ, రోజంతా హెల్మెట్ లేదా టోపీ","నేను ఎప్పుడూ తలకు నూనె రాయను","ఏదీ లేదు"]],
["హెచ్చరిక సంకేతాలు? వర్తించేవన్నీ ఎంచుకోండి.",["నొప్పి, చీము లేదా మచ్చలు పడే తల చర్మం","కనుబొమ్మలు, కనురెప్పలు, శరీర వెంట్రుకలు కూడా రాలడం","మచ్చలతో పాటు దద్దుర్లు, పొలుసులు లేదా గోళ్లపై గుంతలు","వివరించలేని బరువు తగ్గడం, జ్వరం లేదా చాలా వేగంగా రాలడం","ఏదీ లేదు"]]]},
ta:{t:"காலித்ய நிதானம்",d:"முடி உதிர்வுக்கான ஆயுர்வேத மதிப்பீடு: காரணங்கள், உச்சந்தலை, செரிமானம், தாதுக்கள் ஆய்வு, பின்னர் மூலக் காரண நிர்ணயமும் திட்டமும்.",h:"அடுத்து என்ன நடக்கும்",b:["13 சிறு கேள்விகள், சுமார் 4 நிமிடம்","தோஷ சுயவிவரம், மூலக் காரணங்கள், தனிப்பட்ட திட்டம்","உங்கள் தரவு உங்கள் தொலைபேசியிலேயே இருக்கும்"],n:"இது கல்விசார் பரிசோதனை மட்டுமே. பதிவு பெற்ற ஆயுர்வேத மருத்துவர் (BAMS) அல்லது தோல் மருத்துவரின் பரிசோதனைக்கு மாற்றல்ல.",st:"மதிப்பீட்டைத் தொடங்கு",bk:"பின்",nx:"அடுத்து",sd:"முடிவைப் பார்",qn:"கேள்வி {x}/{n}",rn:"முடிவுகள் தற்போது ஆங்கிலத்தில் காட்டப்படும்; மொழிபெயர்ப்பு அடுத்த கட்டத்தில் வரும்.",ch:"உங்கள் மொழியைத் தேர்வு செய்யுங்கள்",
s:["தோற்றம் (பரீட்சை)","உச்சந்தலை (பரீட்சை)","ஆகாரம்","விஹாரம்","செரிமானம் (அக்னி)","தாது போஷணம்","பொது உடல்நல ஆய்வு","பரம்பரை, பழக்கங்கள்","பாதுகாப்பு சோதனை"],
q:[["முடி உதிர்வு எப்படி இருக்கிறது?",["தலை முழுவதும் படிப்படியாக மெலிதல்","நெற்றி பின்னோக்கி செல்லுதல் அல்லது உச்சந்தலை மெலிதல்","திடீரென வட்டமான வழுக்கைத் திட்டுகள்","நோய், பிரசவம், அறுவை சிகிச்சை அல்லது அதிர்ச்சிக்கு 2–3 மாதங்களுக்குப் பின் கொத்தாக உதிர்தல்"]],
["இது எவ்வளவு காலமாக உள்ளது?",["3 மாதங்களுக்கும் குறைவு","3 முதல் 12 மாதங்கள்","ஒரு வருடத்திற்கு மேல்"]],
["உச்சந்தலையும் முடியும் எப்படி உள்ளன? பொருந்துவன அனைத்தையும் தேர்வு செய்யுங்கள்.",["சூடு, எரிச்சல், உணர்திறன் அல்லது வியர்வை; இளநரை","வறண்ட, இறுக்கமான தோல்; முடி சொரசொரப்பு, எளிதில் உடைதல்","எண்ணெய்ப் பசை, கனமான தலை; பொடுகு, அரிப்பு","இவற்றில் எதுவுமில்லை"]],
["வழக்கமான உணவு? பொருந்துவன அனைத்தையும் தேர்வு செய்யுங்கள்.",["காரம், உப்பு, புளிப்பு, வறுத்த அல்லது பதப்படுத்திய உணவு; தேநீர், காபி, மது","உணவைத் தவிர்த்தல், ஒழுங்கற்ற நேரம், வறண்ட அல்லது குளிர் உணவு, கடும் டயட்","கனமான, இனிப்பு, எண்ணெய் அல்லது பால் உணவு; அதிகமாக உண்ணுதல்; குளிர் பானங்கள்","புரதம், கீரை, கொட்டைகள், இரும்புச்சத்து உணவு குறைவு"]],
["உங்கள் மன அழுத்தம் எப்படி?",["கவலை, பயம், அதிகமாக யோசித்தல்","கோபம், எரிச்சல், வேலை அழுத்தம்","சோர்வு, சோம்பல், தனிமை","பெரும்பாலும் அமைதி"]],
["தூக்கம் எப்படி?",["லேசான, துண்டிக்கப்படும் அல்லது 6 மணிக்கும் குறைவு","தாமதமாக படுத்தல், திரைகள், ஆனால் தூக்கம் வரும்","நீண்ட, கனமான தூக்கம்; எழுந்ததும் மந்தம்","ஆழ்ந்த, 7–8 மணி"]],
["செரிமானமும் பசியும் எப்படி?",["பசி ஒழுங்கற்றது, வாயு, வயிறு உப்புசம், மலச்சிக்கல்","அதிக பசி, அமிலத்தன்மை, நெஞ்செரிச்சல், தளர்ந்த மலம்","பசி குறைவு, கனமான உணர்வு, உண்டபின் குமட்டல்","சீராகவும் சுகமாகவும்"]],
["ஆமம் (செரிக்காத கழிவு) அறிகுறிகள் உள்ளனவா? பொருந்துவன அனைத்தையும் தேர்வு செய்யுங்கள்.",["காலையில் நாக்கில் படலம்","உண்டபின் கனம் அல்லது சோம்பல்","பிசுபிசுப்பான மலம் அல்லது வாய் துர்நாற்றம்","எதுவுமில்லை"]],
["அஸ்தி–மஜ்ஜா தாது குறைபாட்டு அறிகுறிகள்? பொருந்துவன அனைத்தையும் தேர்வு செய்யுங்கள்.",["நகங்கள் உடைதல் அல்லது கோடுகள், பலவீனமான பற்கள்","மூட்டு சத்தம், எலும்பு அல்லது முதுகு வலி","தொடர் சோர்வு, பலவீனம்","வறண்ட தோல், உதடுகள்; எடை குறைதல்","எதுவுமில்லை"]],
["இவற்றில் ஏதேனும் உள்ளதா? பொருந்துவன அனைத்தையும் தேர்வு செய்யுங்கள்.",["தைராய்டு","PCOS அல்லது ஒழுங்கற்ற மாதவிடாய்","கடந்த 12 மாதங்களில் பிரசவம் அல்லது பாலூட்டல்","இரத்தசோகை, குறைந்த ஃபெரிடின், B12 அல்லது வைட்டமின் D","கடந்த 6 மாதங்களில் காய்ச்சல், அறுவை சிகிச்சை அல்லது பெரிய நோய்","எதுவுமில்லை"]],
["குடும்பத்தில் வழுக்கை அல்லது முடி மெலிதல் உண்டா?",["ஆம், பெற்றோர் அல்லது தாத்தா பாட்டியிடம்","இல்லை / தெரியாது"]],

<h3>Not progressing? See a doctor if</h3>${li(["Shedding is higher than baseline after 6–8 weeks.","Itching, rash, burning or swelling after any oil or paste (stop that product).","Acidity, loose stools, nausea or dizziness on herbs (stop and call your Vaidya).","New bald patches, scaling, pain, or hair falling from eyebrows or body.","Unexplained weight loss, fatigue or fever."])}`+(T.pa?"<p class=\"mu\">Patchy loss: get a dermatologist’s opinion at 4–6 weeks even if patches look better.</p>":"")}

/* ---------- engine ---------- */
const ALS_st={id:null,i:0,ans:{}};
function alById(id){return AL.find(x=>x.id===id)}
function alSet(id){ALS_st.id=id;ALS_st.i=0;ALS_st.ans={};if(id==="hair"){i=0;ans=Q.map(()=>[]);window._gateOpen=false;cur=null}else if(window.onAssessmentStart)window.onAssessmentStart();alRender()}
function alChange(){ALS_st.id=null;ALS_st.i=0;ALS_st.ans={};cur=null;window._gateOpen=false;try{ans=Q.map(()=>[])}catch(e){}i=0;alRender()}
function alBar(){const b=document.getElementById("alBar");if(!b)return;const a=alById(ALS_st.id);b.innerHTML=a?`<div class="sm mu" style="margin-bottom:10px">Ailment: <b>${esc(a.n)}</b> · <button class="lnk" onclick="alChange()">Change ailment</button></div>`:""}
function alRender(){
 alBar();
 if(!ALS_st.id){alPicker();return}
 if(ALS_st.id==="hair"){if(typeof cur==="function"&&cur)cur();else init();return}
 alDraw();
}
function alPicker(){
 app.innerHTML=`<h1>What would you like help with?</h1><p class="mu" style="margin:6px 0 16px">Choose one ailment first. The questions after that are specific to it. This tool prepares a summary for a doctor. It does not diagnose.</p>
 ${ALG.map((g,gi)=>`<div class="card"><h3>${esc(g)}</h3><div class="chips">${AL.filter(a=>a.g===gi).map(a=>`<button onclick="alSet('${a.id}')">${esc(a.n)}</button>`).join("")}</div></div>`).join("")}
 <p class="mu sm">Question content is framed only from Ministry of Ayush and NIH sources. The sources behind each question set are shown on the summary. A registered Vaidya has not yet reviewed these questions.</p>`;scrollTo(0,0)}
function alSteps(){const a=alById(ALS_st.id);return [...ALCOMMON,...a.qs]}
function alDraw(){const st=alSteps(),n=ALS_st.i,q=st[n],a=ALS_st.ans[n]||[],last=n===st.length-1;

 const red=[...new Set(sels.flatMap(x=>x.o.filter(o=>o.k==="!").map(o=>o.msg)))];
 const skipQ=/^(Which describe your food|Which describe your routine|Has stress or poor sleep|Does anyone in your family)/;
 const rupa=sels.filter(x=>/^Rupa/.test(x.q.tag)&&!/How long|How much does it affect/.test(x.q.q)).flatMap(x=>x.o.map(o=>o.t).filter(t=>!ALN_NEUTRAL.test(t)));
 const trig=[...new Set(sels.filter(x=>/^Hetu|^Upashaya/.test(x.q.tag)&&!skipQ.test(x.q.q)&&!/What have you (tried|been applying)/.test(x.q.q)).flatMap(x=>x.o.map(o=>o.t).filter(t=>!ALN_NEUTRAL.test(t)&&!ALN_CAUSE[t])))];

 if(has("Yes, a lot"))fac.push(["Significant stress or poor sleep","Ongoing stress and poor sleep (Manasika nidana) disturb digestion and the nervous system, and often make other complaints worse."]);
 else if(has("Some")&&sels.some(x=>/Has stress or poor sleep/.test(x.q.q)))fac.push(["Some stress or poor sleep","Some stress or poor sleep was reported. Over time this can add to the other factors."]);
 const fam=sels.some(x=>/Does anyone in your family/.test(x.q.q)&&x.o.some(o=>o.t==="Yes"));
 if(fam)fac.push(["Family history","A relative with the same or a related problem points to a family tendency (Kulaja or Sahaja), which usually means a longer course and steadier care."]);
 const habits=["Frequent fried, very spicy or oily food","Frequent sour or fermented food (curd, pickles)","Often combine incompatible foods (for example fish with milk)","Irregular meal times, or eating before the last meal is digested","Sleep late at night","Sleep in the daytime","Often hold back natural urges (urine, stool, thirst, sleep)","Little physical activity"].filter(has).length;
 const strain=habits>=4?"High":habits>=2?"Moderate":habits>=1?"Low":"None reported";
 const strainTxt=habits?`${habits} of 8 food and routine habits that classical texts link with disturbed digestion were reported. This is a habit count from your answers, not a test, and your Vaidya will check your digestion and tongue, pulse and appetite directly.`:"None of the listed food or routine habits was reported. Your Vaidya will still check digestion directly.";
 const dur=has("More than a year")?"long":has("3 to 12 months")?"mid":has("2 weeks to 3 months")||has("Less than 2 weeks")?"short":"";
 const lot=has("A lot")||has("Every month or more");
 const pri=red.length?{lvl:"See a doctor soon",why:"Some answers match warning signs from the NIH and Ayush sources that need a doctor's review soon."}:lot||dur==="long"?{lvl:"Consult soon",why:lot?"It affects your daily life or you fall ill often, so a consultation within a few days is sensible.":"It has lasted more than a year, so a proper consultation is worthwhile rather than home care alone."}:{lvl:"Routine",why:"No warning signs were reported. A routine consultation is enough."};
 const outlook=red.length?"The outlook cannot be judged until a doctor has seen you and checked the warning signs you reported.":fam&&dur==="long"?"Long-standing with a family tendency: change is usually gradual. Expect steady care over several months with a review every 4 to 6 weeks.":dur==="long"?"Long-standing: improvement is usually gradual. Expect a few months of regular care and a review every 4 to 6 weeks.":dur==="mid"?"Present for some months: it usually responds when causes are corrected. Plan on a review at 4 to 6 weeks.":dur==="short"?"Recent onset: this is often the easiest stage to address. Plan on a review in 2 to 4 weeks, sooner if it worsens.":"The duration was not clear. Your Vaidya will set the review time.";
 const guide=[];
 if(habits===0||has("Irregular meal times, or eating before the last meal is digested")||has("Frequent fried, very spicy or oily food"))guide.push("Eat freshly cooked food at fixed times, and only when the previous meal has digested.");
 if(has("Often combine incompatible foods (for example fish with milk)")||ail.g===0)guide.push("Avoid incompatible combinations such as fish with milk, and limit very sour, salty or fermented food.");
 if(has("Sleep late at night")||has("Sleep in the daytime"))guide.push("Keep a fixed bedtime and wake time. Avoid daytime sleep unless your Vaidya advises it.");
 if(has("Often hold back natural urges (urine, stool, thirst, sleep)"))guide.push("Do not hold back urine, stool, thirst or sleep.");
 if(has("Little physical activity"))guide.push("Add a daily walk or gentle exercise, building up slowly.");
 if(has("Long exposure to heat or sun"))guide.push("Limit long exposure to heat and sun, and drink water regularly.");
 if(has("Yes, a lot")||has("Some"))guide.push("Protect sleep and set aside time each day to unwind. Tell your Vaidya how stress affects you.");
 guide.push("Do not start herbal medicines, oils on broken skin or procedures on your own. Your Vaidya decides after examination.");
 const prep=["A list of all medicines you take now, with doses","Any recent blood or scan reports","A short timeline: when it started and what made it better or worse","Photos of the problem over time, if it is visible"];
 return {pri,rupa,trig,fac,smp:ALN_SMP[ail.g]||ALN_SMP[7],strain,strainTxt,outlook,guide,prep};
}

function stackTables(root){

  const h=t.rows[0];if(!h||!h.cells.length||![...h.cells].every(c=>c.tagName==="TH")||h.cells.length<3)return;

function planFor(lines){
 const sups=DB.suppliers.filter(x=>x.status==="verified"),info={};
 sups.forEach(x=>{info[x.id]=Object.assign({fee:Math.max(0,+x.ship||0)},etaFor(x))});
 const want=[],back=[];
 lines.forEach(l=>{const tot=sups.reduce((t,x)=>t+stockOf(l.pid,x.id),0),have=Math.min(l.qty,tot);if(have>0)want.push({pid:l.pid,qty:have});if(l.qty>have){const pr=prod(l.pid),ps=pr&&sup(pr.sup);back.push({pid:l.pid,qty:l.qty-have,days:(ps&&parseInt(ps.restock,10))||7})}});

  if(!want.every(w=>set.reduce((t,x)=>t+stockOf(w.pid,x.id),0)>=w.qty))continue;
  const asg={};
  want.forEach(w=>{
   const one=set.find(x=>stockOf(w.pid,x.id)>=w.qty);
   if(one){(asg[one.id]=asg[one.id]||[]).push({pid:w.pid,qty:w.qty});return}

 objs[1]=`<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${pages.length} >>`;

 <p class="mu sm">For mineral or Rasa products, give the assay details. Admin checks them before approval.</p>

function submitSup(){const s=sup(S.sup);s.licence=$("sl").value.trim();s.gmp=$("sg").value.trim();s.report=$("sr").checked;save();toast("Submitted for admin review");render()}
function addProduct(){
 const n=$("an").value.trim(),f=$("af").value.trim(),p=parseFloat($("ap").value),b=$("ab").value.trim();
 if(!n||!f||!(p>0)||!b||!$("ac").checked){toast("Fill every field and attach the batch report");return}
 const hm=$("ahm").checked;let assay=null;
 if(hm){
  if(!$("aht").checked){toast("Mineral products need a heavy-metal assay");return}
  const lab=$("aal").value.trim(),no=$("aan").value.trim(),dt=$("aad").value;
  if(!lab||!no||!dt){toast("Add the lab name, report number and test date of the heavy-metal assay");return}
  if(dt>isoDay(new Date())){toast("The assay date cannot be in the future");return}
  assay={lab,no,date:dt};
 }
 const q=Math.max(0,parseInt(($("aq")||{}).value,10)||0),pid=uid();
 DB.products.push({id:pid,sup:S.sup,name:n,form:f,price:p,batch:b,status:"pending",ail:[],ref:[],hm,ht:hm&&!!assay,assay,note:""});DB.stock[pid]={[S.sup]:q};save();toast("Submitted for approval");render();
}

function stockFold(s){
 const has=p=>((DB.stock||{})[p.id]||{})[s.id]!==undefined;
 const mine=DB.products.filter(p=>p.status==="approved"&&(p.sup===s.id||has(p)));
 const others=DB.products.filter(p=>p.status==="approved"&&p.sup!==s.id&&!has(p));
 return fold("sup_stock","Stock and dispatch",`<p class="mu sm">Patients' orders are sent to the verified suppliers who can deliver soonest, using the stock you enter here. Keep it up to date: when a product runs out, the patient is told it is back-ordered.</p>
 <table><tr><th>Product</th><th>Units in stock</th></tr>${mine.map(p=>`<tr><td class="sm">${E(p.name)}<br><span class="mu">${E(p.form)}${p.sup!==s.id?" · listed by "+E(sup(p.sup).name.split(" (")[0]):""}</span></td><td><input id="st_${p.id}" type="number" min="0" value="${stockOf(p.id,s.id)}" aria-label="Units in stock for ${E(p.name)}" style="width:90px"></td></tr>`).join("")||"<tr><td colspan=2>No approved products yet.</td></tr>"}</table>
 <button class="btn s" onclick="NC.saveStock()">Save stock</button>
 ${others.length?`<p class="sm" style="margin-top:10px"><b>Also stock a product another supplier lists?</b> Same product, same price, same batch rules. Exact products only.</p><div class="fl"><select id="dv_p" aria-label="Product to stock">${others.map(p=>`<option value="${p.id}">${E(p.name)}</option>`).join("")}</select><input id="dv_q" type="number" min="1" placeholder="Units" aria-label="Units to stock" style="width:90px"><button class="btn s" onclick="NC.addDistrib()">Add</button></div>`:""}

 <div class="grid" style="gap:8px"><label class="sm">Your PIN code<br><input id="sp_pin" inputmode="numeric" maxlength="6" value="${E(s.pin||"")}"></label><label class="sm">Dispatch within (days, 1 to 7)<br><input id="sp_d" type="number" min="1" max="7" value="${s.dispatch||1}"></label><label class="sm">Shipping fee per parcel (₹)<br><input id="sp_f" type="number" min="0" max="5000" value="${s.ship||0}"></label><label class="sm">Restock time (days)<br><input id="sp_r" type="number" min="1" max="60" value="${s.restock||7}"></label></div>
 <button class="btn s" onclick="NC.saveShip()">Save dispatch settings</button>`,false)
}
function saveStock(){
 const s=sup(S.sup);let bad=false;const upd={};
 DB.products.forEach(p=>{const e=$("st_"+p.id);if(!e)return;const v=e.value.trim();const n=Number(v);if(v===""||!Number.isInteger(n)||n<0||n>100000)bad=true;else upd[p.id]=n});
 if(bad){toast("Stock must be a whole number from 0 to 100000");return}
 Object.keys(upd).forEach(id=>{(DB.stock[id]=DB.stock[id]||{})[s.id]=upd[id]});
 const sent=fillBackorders();save();toast(sent?"Stock saved. "+sent+" waiting parcel"+(sent>1?"s":"")+" now routed":"Stock saved");render()
}
function addDistrib(){
 const s=sup(S.sup),p=prod(($("dv_p")||{}).value),q=parseInt(($("dv_q")||{}).value,10);
 if(s.status!=="verified"){toast("Only verified suppliers can stock products");return}
 if(!p||p.status!=="approved"){toast("Choose an approved product");return}
 if(!(q>0&&q<=100000)){toast("Enter how many units you hold");return}
 (DB.stock[p.id]=DB.stock[p.id]||{})[s.id]=q;const sent=fillBackorders();save();toast("Added to your stock");render()
}
function saveShip(){
 const s=sup(S.sup),pin=val("sp_pin"),d=parseInt(val("sp_d"),10),f=Number(val("sp_f")),r=parseInt(val("sp_r"),10);
 if(!PIN_RE.test(pin)){toast("Enter your 6-digit PIN code");return}
 if(!(d>=1&&d<=7)){toast("Dispatch time must be 1 to 7 days");return}
 if(!(f>=0&&f<=5000)){toast("Shipping fee must be between 0 and 5000");return}
 if(!(r>=1&&r<=60)){toast("Restock time must be 1 to 60 days");return}
 if(pin!==s.pin){s.pin=pin;delete s.lat;delete s.lng;geoPin(pin).then(g=>{if(g){save();render()}})}
 s.dispatch=d;s.ship=f;s.restock=r;save();toast("Dispatch settings saved");render()
}

const certOk=d=>!!(d&&d.cert&&typeof d.cert.data==="string"&&d.cert.data.indexOf("data:image/jpeg;base64,")===0);
function verifyDoc(id){const d=doc(id);if(!d||!d.regno){toast("Cannot verify: registration number missing");return}if(!certOk(d)){toast("Cannot verify: registration certificate image not uploaded");return}d.reg="verified";d.rejectNote="";save();render()}
function rejectDoc(id){const d=doc(id);if(!d)return;const r=val("rd_"+id);if(r.length<3){toast("Write a reason so the doctor knows what to fix");return}d.reg="rejected";d.rejectNote=r;save();toast("Registration rejected");render()}
function certPick(inp){
 const d=doc(S.doc),f=inp.files&&inp.files[0];if(!d||!f)return;
 if(d.reg==="verified"){toast("Your registration is already verified");return}
 if(!/^image\/(jpeg|png|webp)$/.test(f.type)){toast("Upload a photo or scan as JPG, PNG or WebP");inp.value="";return}
 if(f.size>10*1048576){toast("Image is larger than 10 MB. Use a smaller photo.");inp.value="";return}
 const fr=new FileReader();fr.onerror=()=>toast("Could not read that file");
 fr.onload=()=>{const im=new Image();im.onerror=()=>toast("That file is not a readable image");
  im.onload=()=>{let w=im.width,h=im.height;if(!w||!h){toast("That file is not a readable image");return}
   const sc=Math.min(1,1200/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
   const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
   const data=c.toDataURL("image/jpeg",0.75);
   d.cert={name:String(f.name).slice(0,80),data,at:new Date().toISOString()};d.reg="pending";d.rejectNote="";save();toast("Certificate uploaded. The admin will review it.");render()};
  im.src=fr.result};
 fr.readAsDataURL(f)
}
function regCard(){
 const d=doc(S.doc);if(!d)return "";
 const st=d.reg==="verified"?"g":"a";
 return fold("dr_reg","My registration · "+d.reg,`<p class="sm">Registration no.: <b>${E(d.regno||"missing")}</b>${d.council?" · "+E(d.council):""}</p>
 ${d.reg==="verified"?`<p class="good">Your registration is verified. Patients can book you.</p>`:`<p class="sm">Patients cannot book you until the admin verifies your registration. Upload a clear photo or scan of your state Ayurveda council registration certificate.</p>
 ${d.reg==="rejected"?`<p class="warn sm">Rejected: ${E(d.rejectNote||"please upload again")}. Upload a new image to try again.</p>`:""}
 ${certOk(d)?`<p class="sm">Uploaded ${fd(d.cert.at)} (${E(d.cert.name)}). ${d.reg==="pending"?"Waiting for the admin to review it.":""}</p>`:""}
 <label class="sm">Certificate image (JPG, PNG or WebP)<br><input type="file" id="cert_f" accept="image/jpeg,image/png,image/webp" onchange="NC.certPick(this)"></label>
 <p class="mu sm">The image is shrunk and kept in this browser only. Do not upload anything else.</p>`}
 ${certOk(d)?`<details><summary class="sm">View the image you uploaded</summary><img src="${d.cert.data}" alt="Your uploaded registration certificate" style="max-width:100%;border:1px solid var(--ln);border-radius:8px;margin-top:6px"></details>`:""}`,d.reg!=="verified")}
function approveSup(id){const s=sup(id);if(!s.licence||!s.gmp||!s.report){toast("Cannot approve: licence, GMP certificate and batch test report are all needed");return}s.status="verified";save();render()}
function approveProd(id){const p=prod(id);
